<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#EEEAF0" />
<title>Mon Jardin — Budget</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#EEEAF0; --card:#FBF9FB; --ink:#3B2E42; --ink-soft:#8A7C90; --rule:#E1D9E5;
    --stem:#5B7B54; --gold:#D9A441; --gold-soft:#F3E9D2; --danger:#B5555A; --danger-soft:#F3E1E1; --ok-soft:#E6EFE2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); overscroll-behavior-y:none; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .display { font-family: Georgia, "Times New Roman", serif; }
  .wrap { max-width: 448px; margin: 0 auto; padding: 32px 20px 112px; }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .center { justify-content:center; align-items:center; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:24px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .muted { color: var(--ink-soft); }
  .eyebrow { color:var(--ink-soft); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:12px; }
  .statline { display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule); }
  .statline:last-of-type { border-bottom:none; }
  .month-strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:24px; justify-content:center; scrollbar-width:none; }
  .month-strip::-webkit-scrollbar { display:none; }
  .month-chip { flex-shrink:0; min-width:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border-radius:14px; padding:8px 12px; border:1px solid var(--rule); background:var(--card); }
  .month-chip.active { background:var(--ok-soft); border-color:var(--stem); }
  .navbtn { background:none; border:none; font-size:22px; color:var(--ink-soft); padding:8px; cursor:pointer; }
  .fab { position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%; background:var(--stem); color:#fff; font-size:26px; border:none; box-shadow:0 4px 10px rgba(0,0,0,0.2); cursor:pointer; }
  .sheet-overlay { position:fixed; inset:0; background:rgba(59,46,66,0.35); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet { width:100%; max-width:448px; background:var(--bg); border-top:2px solid var(--stem); border-radius:24px 24px 0 0; padding:20px 20px 32px; max-height:90vh; overflow-y:auto; }
  .field-label { display:block; font-size:12px; margin-bottom:4px; color:var(--ink-soft); }
  input, select { font-family: inherit; width:100%; padding:9px 12px; border-radius:14px; border:1px solid var(--rule); background:var(--card); color:var(--ink); font-size:14px; margin-bottom:12px; }
  .segmented { display:flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; margin-bottom:12px; }
  .segmented button { flex:1; border:none; background:transparent; padding:9px 0; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink-soft); font-family:inherit; }
  .segmented button.active-revenu { background:var(--ok-soft); color:var(--stem); }
  .segmented button.active-charge { background:var(--danger-soft); color:var(--danger); }
  .segmented button.active-gold { background:var(--gold-soft); color:var(--gold); }
  .btn-primary { width:100%; padding:12px 0; border-radius:999px; background:var(--stem); color:#fff; border:none; font-size:14px; font-weight:500; cursor:pointer; }
  .link-btn { background:none; border:none; color:var(--ink-soft); font-size:10px; letter-spacing:1px; text-transform:uppercase; text-decoration:underline; cursor:pointer; padding:0; font-family:inherit; }
  .icon-btn { background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:14px; }
  .entry-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--rule); }
  .bar-track { background:var(--rule); height:8px; border-radius:999px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:999px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- storage (100% local, aucune dépendance réseau) ----------
const storage = {
  get: (key) => { const v = localStorage.getItem(key); return v !== null ? { key, value: v } : null; },
  set: (key, value) => { localStorage.setItem(key, value); return { key, value }; },
};

const REVENU_CATS = ["Salaire", "Primes", "Aides", "Autres revenus"];
const CHARGE_CATS = ["Logement", "Alimentation", "Transport", "Enfants", "Loisirs", "Santé", "Autres charges"];
const CAT_HUE = { Logement: 340, Alimentation: 20, Transport: 45, Enfants: 265, Loisirs: 190, Santé: 150, "Autres charges": 300 };
const MOIS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MOIS_ABR = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

function fmtEUR(n) { return n.toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }); }
function monthKey(dateStr) { return dateStr.slice(0, 7); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function addMonths(cursor, delta) {
  const [y, m] = cursor.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function monthLabelOf(cursor) {
  const [y, m] = cursor.split("-").map(Number);
  return { full: `${MOIS_FR[m - 1]} ${y}`, abr: MOIS_ABR[m - 1], y, m };
}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
// santé de 0 (fané) à 1 (pleine floraison) — objectif : charges <= 50% des revenus
function healthFactor(tauxCharges, hasRevenu) {
  if (!hasRevenu) return 0.12;
  if (tauxCharges <= 50) return 1;
  return clamp01((100 - tauxCharges) / 50);
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function computeMonth(cursor, oneOff, recurring) {
  const [y, m] = cursor.split("-").map(Number);
  const dim = daysInMonth(y, m);
  const recInstances = recurring
    .filter((r) => cursor >= r.startMonth && (!r.endMonth || cursor <= r.endMonth))
    .map((r) => {
      const overridden = r.overrides && r.overrides[cursor] !== undefined;
      return { id: `${r.id}-${cursor}`, type: r.type, label: r.label, category: r.category,
        amount: overridden ? r.overrides[cursor] : r.amount,
        date: `${cursor}-${String(Math.min(r.day, dim)).padStart(2, "0")}`, recurring: true, templateId: r.id, overridden };
    });
  const oneOffMonth = oneOff.filter((e) => monthKey(e.date) === cursor);
  const all = [...oneOffMonth, ...recInstances];
  const revenus = all.filter((e) => e.type === "revenu").reduce((s, e) => s + e.amount, 0);
  const charges = all.filter((e) => e.type === "charge").reduce((s, e) => s + e.amount, 0);
  const epargne = revenus - charges;
  const tauxEpargne = revenus > 0 ? (epargne / revenus) * 100 : charges > 0 ? -100 : 0;
  const tauxCharges = revenus > 0 ? (charges / revenus) * 100 : 0;
  return { all, revenus, charges, epargne, tauxEpargne, tauxCharges };
}

// budget restant du mois précédent : saisi directement par l'utilisateur, mois par mois
function getReportManuel(cursor) {
  return state.reportManuel[cursor] || 0;
}

// ---------- SVG builders ----------
function orchidPetalSVG(angle, cx, cy, health, wide, hue) {
  const sat = 12 + health * 72, light = 84 - health * 24, scale = 0.5 + health * 0.5;
  const color = `hsl(${hue} ${sat}% ${light}%)`;
  const w = wide ? 25 : 16;
  return `<g transform="rotate(${angle} ${cx} ${cy}) translate(${cx} ${cy}) scale(${scale}) translate(${-cx} ${-cy})">
    <path d="M${cx},${cy - 12} C${cx - w},${cy - 36} ${cx - w * 0.75},${cy - 66} ${cx},${cy - 80} C${cx + w * 0.75},${cy - 66} ${cx + w},${cy - 36} ${cx},${cy - 12} Z" fill="${color}" opacity="0.95" />
  </g>`;
}
function orchidLipSVG(cx, cy, health) {
  const scale = 0.55 + health * 0.45;
  const lip = `hsl(322 ${25 + health * 65}% ${62 - health * 20}%)`;
  const throat = `hsl(45 ${35 + health * 50}% ${68 - health * 10}%)`;
  const dot = `hsl(322 55% 32%)`;
  const dotOp = 0.25 + health * 0.55;
  return `<g transform="translate(${cx} ${cy + 6}) scale(${scale})">
    <path d="M0,0 C-25,9 -30,32 -15,44 C-6,52 6,52 15,44 C30,32 25,9 0,0 Z" fill="${lip}" opacity="0.97" />
    <ellipse cx="0" cy="20" rx="9" ry="13" fill="${throat}" opacity="0.92" />
    <circle cx="-5" cy="14" r="1.6" fill="${dot}" opacity="${dotOp}" />
    <circle cx="4" cy="17" r="1.4" fill="${dot}" opacity="${dotOp}" />
    <circle cx="0" cy="25" r="1.3" fill="${dot}" opacity="${dotOp}" />
  </g>`;
}
function heroFlowerSVG(monthData) {
  const health = healthFactor(monthData.tauxCharges, monthData.revenus > 0);
  const cx = 110, cy = 112;
  const tone = health < 0.4 ? "var(--danger)" : health < 0.7 ? "var(--gold)" : "var(--stem)";

  // couleur/robustesse de la tige et des feuilles : progresse avec la santé, dès la graine
  const stemColor = `hsl(100 ${8 + health * 47}% ${38 - health * 6}%)`;
  const leaves = `
    <path d="M${cx},${cy + 46} C${cx - 20},${cy + 40} ${cx - 26},${cy + 28} ${cx - 18},${cy + 20} C${cx - 8},${cy + 28} ${cx - 4},${cy + 38} ${cx},${cy + 46}" fill="${stemColor}" opacity="0.85" />
    <path d="M${cx},${cy + 54} C${cx + 20},${cy + 48} ${cx + 26},${cy + 36} ${cx + 18},${cy + 28} C${cx + 8},${cy + 36} ${cx + 4},${cy + 46} ${cx},${cy + 54}" fill="${stemColor}" opacity="0.85" />`;
  const stem = `<path d="M${cx},${cy + 66} C${cx},${cy + 36} ${cx},${cy + 16} ${cx},${cy + 6}" stroke="${stemColor}" stroke-width="4" fill="none" stroke-linecap="round" />`;

  let top = "";
  if (health < 0.15) {
    // graine / pousse : rien qu'un petit bourgeon fermé, terne
    const p = clamp01(health / 0.15);
    const budColor = `hsl(95 ${10 + p * 20}% ${30 + p * 10}%)`;
    top = `<ellipse cx="${cx}" cy="${cy + 4}" rx="${4 + p * 3}" ry="${7 + p * 4}" fill="${budColor}" />`;
  } else if (health < 0.45) {
    // bouton : les 3 sépales se forment, encore fermés, pas de lèvre
    const p = clamp01((health - 0.15) / 0.3);
    const sepals = [
      { angle: 0, hue: 100 + p * 190 },
      { angle: -132, hue: 100 + p * 175 },
      { angle: 132, hue: 100 + p * 175 },
    ];
    top = sepals.map((s) => orchidPetalSVG(s.angle, cx, cy, 0.15 + p * 0.35, false, s.hue)).join("");
  } else if (health < 0.75) {
    // pré-floraison : les 2 pétales larges apparaissent, toujours pas de lèvre
    const p = clamp01((health - 0.45) / 0.3);
    const layout = [
      { angle: 0, wide: false, hue: 300 },
      { angle: -52, wide: true, hue: 315 },
      { angle: 52, wide: true, hue: 315 },
      { angle: -132, wide: false, hue: 285 },
      { angle: 132, wide: false, hue: 285 },
    ];
    top = layout.map((pt) => orchidPetalSVG(pt.angle, cx, cy, 0.4 + p * 0.3, pt.wide, pt.hue)).join("");
  } else {
    // fleur épanouie : tout, y compris la lèvre caractéristique
    const p = clamp01((health - 0.75) / 0.25);
    const layout = [
      { angle: 0, wide: false, hue: 300 },
      { angle: -52, wide: true, hue: 315 },
      { angle: 52, wide: true, hue: 315 },
      { angle: -132, wide: false, hue: 285 },
      { angle: 132, wide: false, hue: 285 },
    ];
    const petalHealth = 0.7 + p * 0.3;
    const columnColor = `hsl(45 ${25 + petalHealth * 55}% ${72 - petalHealth * 12}%)`;
    top = layout.map((pt) => orchidPetalSVG(pt.angle, cx, cy, petalHealth, pt.wide, pt.hue)).join("")
      + orchidLipSVG(cx, cy, petalHealth)
      + `<ellipse cx="${cx}" cy="${cy + 2}" rx="${6 + petalHealth * 2}" ry="${8 + petalHealth * 2}" fill="${columnColor}" />`;
  }

  return `<svg width="220" height="230" viewBox="0 0 220 230">
    ${stem}
    ${leaves}
    ${top}
    <text x="${cx}" y="${cy + 92}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${monthData.tauxCharges.toFixed(0)}%</text>
    <text x="${cx}" y="230" text-anchor="middle" font-size="10" letter-spacing="1" fill="${tone}">ÉQUILIBRE BUDGÉTAIRE</text>
  </svg>`;
}
function miniFlowerSVG(hue, health, size) {
  const sat = 15 + health * 70, light = 78 - health * 15;
  const color = `hsl(${hue} ${sat}% ${light}%)`;
  const c = size;
  let petals = "";
  [0, 72, 144, 216, 288].forEach((a) => {
    petals += `<g transform="rotate(${a} ${c} ${c})"><ellipse cx="${c}" cy="${c - size * 0.55}" rx="${size * 0.32}" ry="${size * 0.45}" fill="${color}" opacity="0.95" /></g>`;
  });
  return `<svg width="${size * 2}" height="${size * 2}" viewBox="0 0 ${c * 2} ${c * 2}" style="flex-shrink:0">${petals}<circle cx="${c}" cy="${c}" r="${size * 0.28}" fill="var(--gold)" /></svg>`;
}
function budSVG(tauxCharges, hasData, hasRevenu) {
  const health = healthFactor(tauxCharges, hasRevenu);
  const color = hasData ? `hsl(330 ${20 + health * 60}% ${72 - health * 14}%)` : "var(--rule)";
  const r = hasData ? 5 + health * 2 : 3;
  return `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="${r}" fill="${color}" /></svg>`;
}

// ---------- state ----------
let state = {
  oneOff: [], recurring: [], epargneMouvements: [], epargneRecurrents: [], reportManuel: {}, loading: true, error: null,
  cursor: todayISO().slice(0, 7),
  formOpen: false, recurringPanelOpen: false, epargneFormOpen: false, epargnePanelOpen: false, overrideOpen: false, overrideTemplateId: null, overrideAmount: "",
  treasuryOpen: false, treasuryContext: "global", treasuryAdjustOpen: false,
  treasuryAdjustDraft: { amount: "", cat: "enfants" },
  formType: "charge", freq: "ponctuelle", epargneFreq: "ponctuelle",
  epargneFormContext: "epargne", epargnePanelContext: "epargne",
  saving: false,
  draft: { label: "", amount: "", date: todayISO(), day: "1" },
  epargneDraft: { categorie: "enfants", type: "versement", amount: "", date: todayISO(), day: "1", startMonth: todayISO().slice(0, 7), endMonth: "" },
};

const COMPTE_LABELS = { enfants: "Enfants", couple: "Couple", courses: "Courses" };
const COMPTE_HUE = { enfants: 265, couple: 10, courses: 20 };

// solde cumulé d'un compte (enfants/couple/courses) jusqu'au mois affiché inclus,
// mouvements ponctuels + instances des mouvements récurrents actifs sur la période
function compteBalance(cat, cursor, mouvements, recurrents) {
  let total = mouvements
    .filter((m) => m.categorie === cat && monthKey(m.date) <= cursor)
    .reduce((s, m) => s + (m.type === "versement" ? m.amount : -m.amount), 0);
  recurrents.filter((r) => r.categorie === cat).forEach((r) => {
    const end = r.endMonth && r.endMonth < cursor ? r.endMonth : cursor;
    let m = r.startMonth, guard = 0;
    while (m <= end && guard < 600) {
      total += r.type === "versement" ? r.amount : -r.amount;
      m = addMonths(m, 1);
      guard++;
    }
  });
  return total;
}

// ---------- trésorerie temps réel (pointage passé / solde actuel / à venir) ----------
function futureDateISO(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function monthRange(startMonth, endMonth) {
  const out = [];
  let m = startMonth, guard = 0;
  while (m <= endMonth && guard < 24) { out.push(m); m = addMonths(m, 1); guard++; }
  return out;
}
function splitLedger(ops, startBalance, today) {
  ops.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  let balance = startBalance;
  const past = [], future = [];
  ops.forEach((op) => {
    balance += op.amount;
    const withBalance = { ...op, balance };
    (op.date <= today ? past : future).push(withBalance);
  });
  const soldeActuel = past.length ? past[past.length - 1].balance : startBalance;
  return { past: [...past].reverse(), future, soldeActuel };
}
function buildGlobalLedger() {
  const today = todayISO();
  const monthStart = today.slice(0, 7) + "-01";
  const endDate = futureDateISO(90);
  const months = monthRange(monthKey(monthStart), monthKey(endDate));
  const ops = [];
  state.oneOff.forEach((e) => {
    if (e.date >= monthStart && e.date <= endDate) {
      ops.push({ date: e.date, label: e.label, amount: e.type === "revenu" ? e.amount : -e.amount, recurring: false });
    }
  });
  months.forEach((mo) => {
    state.recurring.forEach((r) => {
      if (mo >= r.startMonth && (!r.endMonth || mo <= r.endMonth)) {
        const [y, m] = mo.split("-").map(Number);
        const date = `${mo}-${String(Math.min(r.day, daysInMonth(y, m))).padStart(2, "0")}`;
        if (date >= monthStart && date <= endDate) {
          const amt = r.overrides && r.overrides[mo] !== undefined ? r.overrides[mo] : r.amount;
          ops.push({ date, label: r.label, amount: r.type === "revenu" ? amt : -amt, recurring: true });
        }
      }
    });
  });
  return splitLedger(ops, getReportManuel(monthKey(monthStart)), today);
}
function buildCompteLedger(context) {
  const cats = CONTEXT_CATS[context];
  const today = todayISO();
  const monthStart = today.slice(0, 7) + "-01";
  const endDate = futureDateISO(90);
  const prevMonth = addMonths(monthKey(monthStart), -1);
  const months = monthRange(monthKey(monthStart), monthKey(endDate));
  let startBalance = 0;
  cats.forEach((cat) => { startBalance += compteBalance(cat, prevMonth, state.epargneMouvements, state.epargneRecurrents); });
  const ops = [];
  state.epargneMouvements.forEach((mv) => {
    if (cats.includes(mv.categorie) && mv.date >= monthStart && mv.date <= endDate) {
      ops.push({ date: mv.date, label: `${COMPTE_LABELS[mv.categorie]} — ${mv.type === "versement" ? "Versement" : "Retrait"}`, amount: mv.type === "versement" ? mv.amount : -mv.amount, recurring: false });
    }
  });
  months.forEach((mo) => {
    state.epargneRecurrents.forEach((r) => {
      if (cats.includes(r.categorie) && mo >= r.startMonth && (!r.endMonth || mo <= r.endMonth)) {
        const [y, m] = mo.split("-").map(Number);
        const date = `${mo}-${String(Math.min(r.day, daysInMonth(y, m))).padStart(2, "0")}`;
        if (date >= monthStart && date <= endDate) {
          ops.push({ date, label: `${COMPTE_LABELS[r.categorie]} — ${r.type === "versement" ? "Versement" : "Retrait"} (récurrent)`, amount: r.type === "versement" ? r.amount : -r.amount, recurring: true });
        }
      }
    });
  });
  return splitLedger(ops, startBalance, today);
}

function loadData() {
  try {
    const res = storage.get("finance-data");
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      state.oneOff = parsed.entries || [];
      state.recurring = parsed.recurring || [];
      state.epargneMouvements = parsed.epargneMouvements || [];
      state.epargneRecurrents = parsed.epargneRecurrents || [];
      state.reportManuel = parsed.reportManuel || {};
    }
  } catch (e) {}
  state.loading = false;
}
function persist() {
  state.saving = true;
  try { storage.set("finance-data", JSON.stringify({ entries: state.oneOff, recurring: state.recurring, epargneMouvements: state.epargneMouvements, epargneRecurrents: state.epargneRecurrents, reportManuel: state.reportManuel })); }
  catch (e) { state.error = "Impossible d'enregistrer sur cet appareil."; }
  state.saving = false;
}

// ---------- render ----------
function logoSVG() {
  return `<svg width="26" height="26" viewBox="0 0 40 40" style="flex-shrink:0">
    <g transform="translate(20 21)">
      <path d="M0,-4 C-9,-13 -8,-24 0,-29 C8,-24 9,-13 0,-4 Z" fill="hsl(300 55% 68%)" />
      <path d="M0,-3 C-9,3 -17,1 -19,-8 C-11,-13 -3,-10 0,-3 Z" fill="hsl(315 60% 66%)" />
      <path d="M0,-3 C9,3 17,1 19,-8 C11,-13 3,-10 0,-3 Z" fill="hsl(315 60% 66%)" />
      <path d="M0,-2 C-7,3 -12,10 -8,17 C-1,15 3,8 0,-2 Z" fill="hsl(285 45% 64%)" />
      <path d="M0,-2 C7,3 12,10 8,17 C1,15 -3,8 0,-2 Z" fill="hsl(285 45% 64%)" />
      <path d="M0,0 C-9,4 -11,13 -5,18 C-2,21 2,21 5,18 C11,13 9,4 0,0 Z" fill="hsl(322 60% 55%)" />
      <ellipse cx="0" cy="9" rx="3.4" ry="5" fill="hsl(45 60% 68%)" />
    </g>
  </svg>`;
}

function headerHTML() {
  return `
  <div class="row between" style="margin-bottom:4px">
    <div class="row" style="gap:8px">
      ${logoSVG()}
      <h1 class="display" style="font-size:24px; font-weight:600; margin:0">Mon Jardin</h1>
    </div>

function monthStripHTML() {
  let chips = "";
  for (let i = -3; i <= 2; i++) {
    const c = addMonths(state.cursor, i);
    const d = computeMonth(c, state.oneOff, state.recurring);
    const lbl = monthLabelOf(c);

    chips += `<button class="month-chip ${active ? "active" : ""}" data-action="goto-month" data-cursor="${c}">
      <span class="muted" style="font-size:10px; text-transform:uppercase">${lbl.abr}</span>
      ${budSVG(d.tauxCharges, d.all.length > 0, d.revenus > 0)}

  }
  return `<div class="month-strip">${chips}</div>`;
}

function categoryCardHTML(monthData) {
  const map = {};
  monthData.all.filter((e) => e.type === "charge").forEach((e) => { map[e.category] = (map[e.category] || 0) + e.amount; });
  const byCategory = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (byCategory.length === 0) return "";
  const maxCat = byCategory[0][1];
  const health = healthFactor(monthData.tauxCharges, monthData.revenus > 0);
  let rows = "";
  byCategory.forEach(([cat, amt]) => {
    const hue = CAT_HUE[cat] || 0;
    rows += `
    <div class="row" style="gap:12px; margin-bottom:12px">
      ${miniFlowerSVG(hue, health, 16)}
      <div style="flex:1; min-width:0">
        <div class="row between" style="font-size:12px; margin-bottom:4px"><span>${esc(cat)}</span><span>${fmtEUR(amt)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(amt / maxCat) * 100}%; background:hsl(${hue} ${20 + health * 60}% ${65 - health * 15}%)"></div></div>
      </div>
    </div>`;
  });
  return `<div class="card" style="margin-bottom:20px"><div class="eyebrow">Parterre des charges</div>${rows}</div>`;
}

      </div>
      <div class="segmented">
        <button class="${ctx === "global" ? "active-gold" : ""}" data-action="set-treasury-ctx" data-ctx="global">Global</button>
        <button class="${ctx === "epargne" ? "active-gold" : ""}" data-action="set-treasury-ctx" data-ctx="epargne">Épargne</button>
        <button class="${ctx === "courses" ? "active-gold" : ""}" data-action="set-treasury-ctx" data-ctx="courses">Courses</button>
      </div>
      <div class="card" style="margin-bottom:16px; padding:16px; background:var(--ok-soft)">
        <div class="row between">
          <span class="muted" style="font-size:13px">Solde actuel — ${TREASURY_TITLES[ctx]}</span>
          <span style="font-size:20px; font-weight:700; color:${ledger.soldeActuel < 0 ? "var(--danger)" : "var(--stem)"}">${fmtEUR(ledger.soldeActuel)}</span>
        </div>
        ${!state.treasuryAdjustOpen
          ? `<button class="link-btn" data-action="toggle-treasury-adjust" style="margin-top:10px">Mettre à jour avec le solde réel</button>`
          : `
          <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--rule)">
            <p class="muted" style="font-size:11px; margin:0 0 10px">Solde prévu par le calcul : ${fmtEUR(ledger.soldeActuel)}. Indique le solde réel constaté (relevé bancaire, cagnotte...) — l'écart sera ajouté automatiquement comme écriture d'ajustement, datée d'aujourd'hui.</p>
            ${ctx === "epargne" ? `
            <label class="field-label">Compte à ajuster</label>
            <select id="f-treasury-adjust-cat">
              ${CONTEXT_CATS.epargne.map((cat) => `<option value="${cat}" ${state.treasuryAdjustDraft.cat === cat ? "selected" : ""}>${COMPTE_LABELS[cat]}</option>`).join("")}
            </select>` : ""}
            <label class="field-label">Solde réel constaté (€)</label>
            <input id="f-treasury-adjust-amount" inputmode="decimal" placeholder="0" />
            <div class="row" style="gap:10px">
              <button class="btn-primary" data-action="confirm-treasury-adjust" style="flex:1">Valider</button>
              <button class="link-btn" data-action="toggle-treasury-adjust">Annuler</button>
            </div>
          </div>`}
      </div>
      <div class="eyebrow">À venir (90 prochains jours)</div>
      ${ledger.future.length === 0 ? `<p class="muted" style="font-size:13px; padding:6px 0; font-style:italic">Rien de programmé pour l'instant.</p>` : ledger.future.map(treasuryOpRow).join("")}
      <div class="eyebrow" style="margin-top:16px">Opérations passées (ce mois-ci)</div>
      ${ledger.past.length === 0 ? `<p class="muted" style="font-size:13px; padding:6px 0; font-style:italic">Aucune opération pointée pour l'instant.</p>` : ledger.past.map(treasuryOpRow).join("")}
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById("root");
  if (state.loading) {
    root.innerHTML = `<div class="wrap"><div class="muted" style="text-align:center; padding:80px 0">Le jardin s'ouvre…</div></div>`;
    return;
  }
  const monthData = computeMonth(state.cursor, state.oneOff, state.recurring);
  monthData.report = getReportManuel(state.cursor);
  root.innerHTML = `
    <div class="wrap">
      ${headerHTML()}
      ${monthNavHTML()}
      ${monthStripHTML()}
      ${heroCardHTML(monthData)}
      ${comptesCardHTML("epargne")}
      ${comptesCardHTML("courses")}
      ${categoryCardHTML(monthData)}
      ${entriesCardHTML(monthData)}
    </div>
    <button class="fab" data-action="open-form">+</button>
    ${formSheetHTML()}
    ${recurringSheetHTML()}
    ${epargneFormSheetHTML()}
    ${epargnePanelHTML()}
    ${amountOverrideSheetHTML()}
    ${treasurySheetHTML()}
    <input id="import-file" type="file" accept="application/json" style="display:none" />
  `;
  // restore draft values into the (freshly rebuilt) form inputs
  if (state.formOpen) {
    const l = document.getElementById("f-label"); if (l) l.value = state.draft.label;
    const a = document.getElementById("f-amount"); if (a) a.value = state.draft.amount;
    const d = document.getElementById("f-date"); if (d) d.value = state.draft.date;
    const day = document.getElementById("f-day"); if (day) day.value = state.draft.day;
    const startmonth = document.getElementById("f-startmonth"); if (startmonth) startmonth.value = state.draft.startMonth || state.cursor;
    const endmonth = document.getElementById("f-endmonth"); if (endmonth) endmonth.value = state.draft.endMonth || "";
    const cat = document.getElementById("f-cat"); if (cat) cat.value = state.draft.category || cat.value;
  }
  if (state.epargneFormOpen) {
    const ea = document.getElementById("f-epargne-amount"); if (ea) ea.value = state.epargneDraft.amount;
    const ed = document.getElementById("f-epargne-date"); if (ed) ed.value = state.epargneDraft.date;
    const eday = document.getElementById("f-epargne-day"); if (eday) eday.value = state.epargneDraft.day;
    const esm = document.getElementById("f-epargne-startmonth"); if (esm) esm.value = state.epargneDraft.startMonth || state.cursor;
    const eem = document.getElementById("f-epargne-endmonth"); if (eem) eem.value = state.epargneDraft.endMonth || "";
  }
  if (state.overrideOpen) {
    const oa = document.getElementById("f-override-amount"); if (oa) oa.value = state.overrideAmount;
  }
  if (state.treasuryAdjustOpen) {
    const ta = document.getElementById("f-treasury-adjust-amount"); if (ta) ta.value = state.treasuryAdjustDraft.amount;
    const tc = document.getElementById("f-treasury-adjust-cat"); if (tc) tc.value = state.treasuryAdjustDraft.cat;
  }
}

function captureDraft() {
  if (!state.formOpen) return;
  const l = document.getElementById("f-label"); if (l) state.draft.label = l.value;
  const a = document.getElementById("f-amount"); if (a) state.draft.amount = a.value;
  const d = document.getElementById("f-date"); if (d) state.draft.date = d.value;
  const day = document.getElementById("f-day"); if (day) state.draft.day = day.value;
  const startmonth = document.getElementById("f-startmonth"); if (startmonth) state.draft.startMonth = startmonth.value;
  const endmonth = document.getElementById("f-endmonth"); if (endmonth) state.draft.endMonth = endmonth.value;
  const cat = document.getElementById("f-cat"); if (cat) state.draft.category = cat.value;
}
function captureEpargneDraft() {
  if (!state.epargneFormOpen) return;
  const ea = document.getElementById("f-epargne-amount"); if (ea) state.epargneDraft.amount = ea.value;
  const ed = document.getElementById("f-epargne-date"); if (ed) state.epargneDraft.date = ed.value;
  const eday = document.getElementById("f-epargne-day"); if (eday) state.epargneDraft.day = eday.value;
  const esm = document.getElementById("f-epargne-startmonth"); if (esm) state.epargneDraft.startMonth = esm.value;
  const eem = document.getElementById("f-epargne-endmonth"); if (eem) state.epargneDraft.endMonth = eem.value;
}
function captureTreasuryAdjustDraft() {
  if (!state.treasuryAdjustOpen) return;
  const ta = document.getElementById("f-treasury-adjust-amount"); if (ta) state.treasuryAdjustDraft.amount = ta.value;
  const tc = document.getElementById("f-treasury-adjust-cat"); if (tc) state.treasuryAdjustDraft.cat = tc.value;
}

function update() { captureDraft(); render(); }

// ---------- actions ----------
function exportData() {
  const payload = { exportedAt: new Date().toISOString(), entries: state.oneOff, recurring: state.recurring, epargneMouvements: state.epargneMouvements, epargneRecurrents: state.epargneRecurrents, reportManuel: state.reportManuel };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `mon-jardin-budget-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const importedEntries = Array.isArray(parsed.entries) ? parsed.entries : [];
      const importedRecurring = Array.isArray(parsed.recurring) ? parsed.recurring : [];
      const importedEpargne = Array.isArray(parsed.epargneMouvements) ? parsed.epargneMouvements : [];
      const importedEpargneRec = Array.isArray(parsed.epargneRecurrents) ? parsed.epargneRecurrents : [];
      const existingIds = new Set(state.oneOff.map((x) => x.id));
      const existingRecIds = new Set(state.recurring.map((x) => x.id));
      const existingEpargneIds = new Set(state.epargneMouvements.map((x) => x.id));
      const existingEpargneRecIds = new Set(state.epargneRecurrents.map((x) => x.id));
      state.oneOff = [...state.oneOff, ...importedEntries.filter((x) => x && x.id && !existingIds.has(x.id))];
      state.recurring = [...state.recurring, ...importedRecurring.filter((x) => x && x.id && !existingRecIds.has(x.id))];
      state.epargneMouvements = [...state.epargneMouvements, ...importedEpargne.filter((x) => x && x.id && !existingEpargneIds.has(x.id))];
      state.epargneRecurrents = [...state.epargneRecurrents, ...importedEpargneRec.filter((x) => x && x.id && !existingEpargneRecIds.has(x.id))];
      if (parsed.reportManuel) state.reportManuel = { ...state.reportManuel, ...parsed.reportManuel };
      persist();
      state.error = null;
    } catch (err) {
      state.error = "Ce fichier ne semble pas être une sauvegarde valide de Mon Jardin.";
    }
    update();
  };
  reader.readAsText(file);
}

document.addEventListener("click", (e) => {
  // tap sur le fond sombre (en dehors de la fenêtre) : on la ferme
  // (attribut séparé data-overlay-close, volontairement PAS data-action,
  // pour que closest("[data-action]") ne le trouve jamais en remontant
  // depuis un clic anodin — ex: un tap dans un champ de texte — à l'intérieur de la fenêtre)
  if (e.target.classList && e.target.classList.contains("sheet-overlay")) {
    const overlayAction = e.target.getAttribute("data-overlay-close");
    if (overlayAction === "close-form") state.formOpen = false;
    if (overlayAction === "close-recurring") state.recurringPanelOpen = false;
    update();
    return;
  }
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.getAttribute("data-action");
  switch (action) {
    case "prev-month": state.cursor = addMonths(state.cursor, -1); update(); break;
    case "next-month": state.cursor = addMonths(state.cursor, 1); update(); break;
    case "goto-month": state.cursor = btn.getAttribute("data-cursor"); update(); break;
    case "open-form":
      state.formOpen = true;
      state.draft = { label: "", amount: "", date: todayISO(), day: "1", startMonth: state.cursor, endMonth: "", category: state.formType === "revenu" ? REVENU_CATS[0] : CHARGE_CATS[0] };
      update();
      break;
    case "close-form": state.formOpen = false; update(); break;
    case "open-recurring": state.recurringPanelOpen = true; update(); break;
    case "close-recurring": state.recurringPanelOpen = false; update(); break;
    case "set-type": {
      captureDraft();
      state.formType = btn.getAttribute("data-type");
      state.draft.category = state.formType === "revenu" ? REVENU_CATS[0] : CHARGE_CATS[0];
      render();
      break;
    }
    case "set-freq": {
      captureDraft();
      state.freq = btn.getAttribute("data-freq");
      render();
      break;
    }
    case "add-entry": {
      captureDraft();
      const amt = parseFloat(String(state.draft.amount).replace(",", "."));
      if (!state.draft.label || !state.draft.label.trim() || !amt || amt <= 0) return;
      if (state.freq === "ponctuelle") {
        state.oneOff.push({ id: uid(), type: state.formType, label: state.draft.label.trim(), category: state.draft.category, amount: Math.round(amt * 100) / 100, date: state.draft.date || todayISO() });
      } else {
        state.recurring.push({ id: uid(), type: state.formType, label: state.draft.label.trim(), category: state.draft.category, amount: Math.round(amt * 100) / 100, day: Math.max(1, Math.min(31, parseInt(state.draft.day, 10) || 1)), startMonth: state.draft.startMonth || state.cursor, endMonth: state.draft.endMonth || null });
      }
      persist();
      state.formOpen = false;
      update();
      break;
    }
    case "remove-oneoff": {
      const id = btn.getAttribute("data-id");
      state.oneOff = state.oneOff.filter((x) => x.id !== id);
      persist();
      update();
      break;
    }
    case "remove-recurring": {
      const id = btn.getAttribute("data-id");
      state.recurring = state.recurring.filter((x) => x.id !== id);
      persist();
      update();
      break;
    }
    case "clear-end-month": {
      const id = btn.getAttribute("data-id");
      const r = state.recurring.find((x) => x.id === id);
      if (r) r.endMonth = null;
      persist();
      update();
      break;
    }
    case "open-amount-override": {
      const id = btn.getAttribute("data-id");
      const r = state.recurring.find((x) => x.id === id);
      if (!r) return;
      state.overrideOpen = true;
      state.overrideTemplateId = id;
      state.overrideAmount = (r.overrides && r.overrides[state.cursor] !== undefined) ? String(r.overrides[state.cursor]) : String(r.amount);
      update();
      break;
    }
    case "close-amount-override": state.overrideOpen = false; update(); break;
    case "save-amount-override": {
      const input = document.getElementById("f-override-amount");
      const amt = parseFloat(String(input ? input.value : state.overrideAmount).replace(",", "."));
      const r = state.recurring.find((x) => x.id === state.overrideTemplateId);
      if (!r || !amt || amt <= 0) return;
      if (!r.overrides) r.overrides = {};
      r.overrides[state.cursor] = Math.round(amt * 100) / 100;
      persist();
      state.overrideOpen = false;
      update();
      break;
    }
    case "clear-amount-override": {
      const r = state.recurring.find((x) => x.id === state.overrideTemplateId);
      if (r && r.overrides) delete r.overrides[state.cursor];
      persist();
      state.overrideOpen = false;
      update();
      break;
    }
    case "open-treasury": state.treasuryOpen = true; update(); break;
    case "close-treasury": state.treasuryOpen = false; update(); break;
    case "set-treasury-ctx": state.treasuryContext = btn.getAttribute("data-ctx"); update(); break;
    case "toggle-treasury-adjust": {
      captureTreasuryAdjustDraft();
      if (!state.treasuryAdjustOpen) {
        const ledger = state.treasuryContext === "global" ? buildGlobalLedger() : buildCompteLedger(state.treasuryContext);
        state.treasuryAdjustDraft = { amount: String(ledger.soldeActuel), cat: CONTEXT_CATS[state.treasuryContext] ? CONTEXT_CATS[state.treasuryContext][0] : "enfants" };
      }
      state.treasuryAdjustOpen = !state.treasuryAdjustOpen;
      update();
      break;
    }
    case "confirm-treasury-adjust": {
      captureTreasuryAdjustDraft();
      const ctx = state.treasuryContext;
      const ledger = ctx === "global" ? buildGlobalLedger() : buildCompteLedger(ctx);
      const soldeReel = parseFloat(String(state.treasuryAdjustDraft.amount).replace(",", "."));
      if (isNaN(soldeReel)) return;
      const diff = Math.round((soldeReel - ledger.soldeActuel) * 100) / 100;
      if (diff !== 0) {
        const today = todayISO();
        if (ctx === "global") {
          state.oneOff.push({ id: uid(), type: diff > 0 ? "revenu" : "charge", label: "Ajustement solde (réel constaté)", category: diff > 0 ? "Autres revenus" : "Autres charges", amount: Math.abs(diff), date: today });
        } else {
          const cat = ctx === "courses" ? "courses" : (state.treasuryAdjustDraft.cat || "enfants");
          state.epargneMouvements.push({ id: uid(), categorie: cat, type: diff > 0 ? "versement" : "retrait", amount: Math.abs(diff), date: today });
        }
        persist();
      }
      state.treasuryAdjustOpen = false;
      update();
      break;
    }
    case "open-epargne-form": {
      const ctx = btn.getAttribute("data-ctx") || "epargne";
      state.epargneFormOpen = true;
      state.epargneFreq = "ponctuelle";
      state.epargneFormContext = ctx;
      state.epargneDraft = { categorie: CONTEXT_CATS[ctx][0], type: "versement", amount: "", date: todayISO(), day: "1", startMonth: state.cursor, endMonth: "" };
      update();
      break;
    }
    case "close-epargne-form": state.epargneFormOpen = false; update(); break;
    case "open-epargne-panel":
      state.epargnePanelContext = btn.getAttribute("data-ctx") || "epargne";
      state.epargnePanelOpen = true;
      update();
      break;
    case "close-epargne-panel": state.epargnePanelOpen = false; update(); break;
    case "set-epargne-cat": {
      captureEpargneDraft();
      state.epargneDraft.categorie = btn.getAttribute("data-cat");
      render();
      break;
    }
    case "set-epargne-type": {
      captureEpargneDraft();
      state.epargneDraft.type = btn.getAttribute("data-type");
      render();
      break;
    }
    case "set-epargne-freq": {
      captureEpargneDraft();
      state.epargneFreq = btn.getAttribute("data-freq");
      render();
      break;
    }
    case "add-epargne": {
      captureEpargneDraft();
      const amt = parseFloat(String(state.epargneDraft.amount).replace(",", "."));
      if (!amt || amt <= 0) return;
      if (state.epargneFreq === "ponctuelle") {
        state.epargneMouvements.push({
          id: uid(), categorie: state.epargneDraft.categorie, type: state.epargneDraft.type,
          amount: Math.round(amt * 100) / 100, date: state.epargneDraft.date || todayISO(),
        });
      } else {
        state.epargneRecurrents.push({
          id: uid(), categorie: state.epargneDraft.categorie, type: state.epargneDraft.type,
          amount: Math.round(amt * 100) / 100, day: Math.max(1, Math.min(31, parseInt(state.epargneDraft.day, 10) || 1)),
          startMonth: state.epargneDraft.startMonth || state.cursor, endMonth: state.epargneDraft.endMonth || null,
        });
      }
      persist();
      state.epargneFormOpen = false;
      update();
      break;
    }
    case "remove-epargne": {
      const id = btn.getAttribute("data-id");
      state.epargneMouvements = state.epargneMouvements.filter((x) => x.id !== id);
      persist();
      update();
      break;
    }
    case "remove-epargne-recurrent": {
      const id = btn.getAttribute("data-id");
      state.epargneRecurrents = state.epargneRecurrents.filter((x) => x.id !== id);
      persist();
      update();
      break;
    }
    case "export-data": exportData(); break;
    case "trigger-import": {
      const input = document.getElementById("import-file");
      if (input) input.click();
      break;
    }
    case "close-overlay": break;
  }
  if (action === "close-form" || action === "close-recurring") return;
  if (btn.classList.contains("sheet-overlay")) update();
});


document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "import-file") {
    const file = e.target.files && e.target.files[0];
    if (file) handleImportFile(file);
    e.target.value = "";
    return;
  }
  if (e.target && e.target.id === "report-manuel") {
    state.reportManuel[state.cursor] = parseFloat(e.target.value) || 0;
    persist();
    update();
    return;
  }
  if (e.target && e.target.classList && e.target.classList.contains("recurring-start-input")) {
    const id = e.target.getAttribute("data-id");
    const r = state.recurring.find((x) => x.id === id);
    if (r && e.target.value) r.startMonth = e.target.value;
    persist();
    update();
    return;
  }
  if (e.target && e.target.classList && e.target.classList.contains("recurring-end-input")) {
    const id = e.target.getAttribute("data-id");
    const r = state.recurring.find((x) => x.id === id);
    if (r) r.endMonth = e.target.value || null;
    persist();
    update();
  }
});

loadData();
render();
</script>
